# Release Notes
# v4.0.14 - 2026-04-24
# - Architecture: receiver registration moved to init() — eliminates race window before Activity launch
# - Architecture: PaymentHandler injected into WebViewManager — single instance, cleaner data flow
# - API: setMyActivityWeakReference annotated @RestrictTo(LIBRARY) — not for merchant use
# - API: init() throws IllegalArgumentException if Activity does not implement NimbblCheckoutPaymentListener
# - Fix: SSL and connection errors now propagate to merchant via onCheckoutResponse

# v4.0.13 - 2026-03-12
# - Bump to 4.0.13; aligned with Core API SDK 4.0.13

# v4.0.12 - 2025-03-06
# - Bump to 4.0.12; depends on Core API SDK 4.0.12 (Maven Central)
# - Publish using Maven AAR dependency (local Core API path commented)

# v4.0.6 - 2025-01-29
# - Fixed ProGuard integration for production builds
# - Added comprehensive consumer ProGuard rules
# - Fixed JWT token parsing with minification enabled
# - Enhanced WebView JavaScript interface protection
# - Improved Gson TypeToken generic signature preservation
# - Added automatic ProGuard rule application via consumer-rules.pro
# - Zero merchant configuration required for ProGuard
# - Production-ready with isMinifyEnabled = true support

# v4.0.0 - 2024-01-15
# - Enhanced error handling with comprehensive validation
# - Improved code quality and reduced warnings
# - Added semantic versioning support
# - Fixed parameter order consistency in ValidationUtils
# - Removed redundant variable initializers
# - Optimized null safety handling
# - Implemented centralized version management system
